[project]
name = "smart-delivery-env"
version = "1.0.0"
description = "AI Delivery Decision RL Environment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ravi Gohel", email = "neuroravii22@gmail.com"}
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "requests",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/RaviGohelAI/smart-delivery-env"
Repository = "https://github.com/ravigohel142996/RL-SmartDelivery-Agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
